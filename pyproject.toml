[project]
name = "gitops"
version = "0.1.0"
description = "Scripts to manage deployment of various services such as ERPNext, Authelia, and Nginx."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pyinfra>=3.10.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "shtab>=1.12.1",
]

[project.scripts]
infra = "cli:main"

[tool.uv.build-backend]
module-name = ["cli", "erpnext", "nginx", "server_init"]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
